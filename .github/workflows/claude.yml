name: Claude

# Runs Claude when a comment, review or issue mentions @claude.
# Setup (once, by Athos):
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Add ONE of these repository secrets (Settings > Secrets and variables > Actions):
#        ANTHROPIC_API_KEY        (API key from console.anthropic.com)
#        CLAUDE_CODE_OAUTH_TOKEN  (Claude subscription token, from `claude setup-token`)
#      and keep the matching line below uncommented.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# One run at a time per issue or PR, so replies stay in order.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # By default only accounts with write access can trigger Claude.
          # If Grok comments through a GitHub App (a "[bot]" account), add it here:
          # allowed_bots: 'grok-bot-name[bot]'

          claude_args: '--max-turns 40'
