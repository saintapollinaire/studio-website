name: CI

# Builds the site on every PR and on main. A PR whose build fails is not mergeable
# (GUIDELINE.md, section 5).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # TODO: commit package-lock.json and switch to `npm ci`.
      - run: npm install --no-audit --no-fund

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
